<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: "Segoe UI", system-ui, sans-serif;
         background: radial-gradient(circle at 30% 20%, #3a3f47 0%, #15171b 60%, #0a0b0d 100%); }
  .calc { position: relative; width: 340px; padding: 26px 22px 22px; border-radius: 28px;
          background:
            repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.04) 1px 2px, transparent 2px 4px),
            linear-gradient(160deg, #e9ecef 0%, #b8bec6 22%, #8a9099 45%, #c9ced4 62%, #9ea4ac 80%, #6d737b 100%);
          box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 0 0 2px #50555c, 0 0 0 4px #c7ccd2, 0 0 0 6px #3b3f45,
                      inset 0 2px 1px rgba(255,255,255,.9), inset 0 -3px 6px rgba(0,0,0,.35); }
  .brand { font-size: 11px; letter-spacing: 4px; font-weight: 700; color: #3e434a; margin: 0 4px 10px;
           text-shadow: 0 1px 0 rgba(255,255,255,.7); display: flex; justify-content: space-between; }
  .brand span:last-child { letter-spacing: 1px; font-weight: 500; }
  .display { border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; min-height: 96px; text-align: right;
             word-wrap: break-word; font-family: "Courier New", ui-monospace, monospace; color: #1d2a1b;
             background: linear-gradient(180deg, #a9b99a 0%, #c4d3b3 40%, #b3c3a2 100%);
             box-shadow: inset 0 3px 8px rgba(0,0,0,.55), inset 0 -1px 2px rgba(255,255,255,.4),
                         0 0 0 3px #2b2e33, 0 0 0 5px #9aa0a8, 0 1px 0 6px rgba(255,255,255,.5); }
  .prev { font-size: 15px; min-height: 20px; opacity: .65; }
  .cur { font-size: 38px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,.12); }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button { padding: 17px 0; font-size: 20px; font-weight: 600; border: none; border-radius: 14px; cursor: pointer;
           color: #2a2e33; text-shadow: 0 1px 0 rgba(255,255,255,.75);
           background: linear-gradient(180deg, #ffffff 0%, #dfe3e8 18%, #aeb4bc 50%, #c9ced4 78%, #f1f3f5 100%);
           box-shadow: 0 4px 0 #555a61, 0 6px 10px rgba(0,0,0,.45), inset 0 1px 1px #fff, inset 0 -2px 3px rgba(0,0,0,.25);
           transition: transform .06s, box-shadow .06s, filter .15s; }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(3px);
                  box-shadow: 0 1px 0 #555a61, 0 2px 4px rgba(0,0,0,.45), inset 0 1px 1px #fff, inset 0 -1px 2px rgba(0,0,0,.25); }
  .fn { color: #f2f4f6; text-shadow: 0 -1px 0 rgba(0,0,0,.6);
        background: linear-gradient(180deg, #8d939b 0%, #5c6168 30%, #3a3e44 55%, #4e535a 80%, #7a8088 100%); }
  .op { color: #3b2a05; text-shadow: 0 1px 0 rgba(255,240,200,.7);
        background: linear-gradient(180deg, #fff3c4 0%, #f1cf6b 20%, #c89b2c 50%, #e3bb4f 78%, #fbe7a1 100%);
        box-shadow: 0 4px 0 #7a5a12, 0 6px 10px rgba(0,0,0,.45), inset 0 1px 1px #fff8de, inset 0 -2px 3px rgba(80,50,0,.35); }
  .eq { color: #3a1606; text-shadow: 0 1px 0 rgba(255,210,180,.6); grid-column: span 4;
        background: linear-gradient(180deg, #ffd2b0 0%, #e59a63 22%, #b0602c 50%, #d4824a 78%, #f7c29a 100%);
        box-shadow: 0 4px 0 #6b3412, 0 6px 10px rgba(0,0,0,.45), inset 0 1px 1px #ffe6d4, inset 0 -2px 3px rgba(70,25,0,.35); }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="brand"><span>CHROME-12</span><span>●●●</span></div>
  <div class="display"><div class="prev" id="prev"></div><div class="cur" id="cur">0</div></div>
  <div class="keys">
    <button class="fn" data-a="clear">AC</button>
    <button class="fn" data-a="del">⌫</button>
    <button class="fn" data-a="pct">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-n="0">0</button>
    <button data-n=".">.</button>
    <button class="fn" data-a="neg">±</button>
    <button class="eq" data-a="eq">=</button>
  </div>
</div>
<script>
  const sym = { '/': '÷', '*': '×', '-': '−', '+': '+' };
  let cur = '0', prev = null, op = null, reset = false;
  const $cur = document.getElementById('cur'), $prev = document.getElementById('prev');

  function render() {
    $cur.textContent = cur;
    $prev.textContent = prev !== null && op ? `${prev} ${sym[op]}` : '';
  }
  function compute(a, b, o) {
    a = parseFloat(a); b = parseFloat(b);
    let r = o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : b === 0 ? NaN : a / b;
    if (!isFinite(r)) return 'Error';
    return String(parseFloat(r.toPrecision(12)));
  }
  function inputNum(n) {
    if (reset || cur === 'Error') { cur = '0'; reset = false; }
    if (n === '.' && cur.includes('.')) return;
    cur = cur === '0' && n !== '.' ? n : cur + n;
  }
  function setOp(o) {
    if (cur === 'Error') return;
    if (op && !reset) cur = compute(prev, cur, op);
    prev = cur; op = o; reset = true;
  }
  function action(a) {
    if (a === 'clear') { cur = '0'; prev = null; op = null; }
    else if (a === 'del') { cur = reset || cur === 'Error' || cur.length <= 1 || (cur.length === 2 && cur[0] === '-') ? '0' : cur.slice(0, -1); reset = false; }
    else if (a === 'pct') { if (cur !== 'Error') cur = String(parseFloat(cur) / 100); }
    else if (a === 'neg') { if (cur !== '0' && cur !== 'Error') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
    else if (a === 'eq') { if (op) { cur = compute(prev, cur, op); prev = null; op = null; reset = true; } }
  }
  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.n) inputNum(b.dataset.n);
    else if (b.dataset.op) setOp(b.dataset.op);
    else action(b.dataset.a);
    render();
  });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^[0-9.]$/.test(k)) inputNum(k);
    else if ('+-*/'.includes(k)) setOp(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); action('eq'); }
    else if (k === 'Backspace') action('del');
    else if (k === 'Escape') action('clear');
    else if (k === '%') action('pct');
    else return;
    render();
  });
</script>
</body>
</html>
